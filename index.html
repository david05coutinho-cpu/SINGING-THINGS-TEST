<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monster Island</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,sans-serif;overflow:hidden;
  background:#07152b;color:#fff;transition:background 2s;
}
body.day{background:#72c9f5}
body.night{background:#07152b}
button{font:inherit}
#game{height:100vh;position:relative;overflow:hidden}
#sky{position:absolute;inset:0;overflow:hidden;transition:background 2s}
.day #sky{background:linear-gradient(#55b9ee 0%,#b9edff 60%,#6fca72 100%)}
.night #sky{background:linear-gradient(#050b22 0%,#172a62 58%,#183d37 100%)}

#sun,#moon{
 position:absolute;width:80px;height:80px;border-radius:50%;top:8%;right:10%;
 transition:opacity 2s,transform 2s;
}
#sun{background:#ffe36e;box-shadow:0 0 45px #ffe36e}
#moon{background:#e8eeff;box-shadow:0 0 35px #aebfff;opacity:0}
.night #sun{opacity:0;transform:translateY(30px)}
.night #moon{opacity:1}
.day #sun{opacity:1}
.day #moon{opacity:0}

.star{position:absolute;width:3px;height:3px;background:white;border-radius:50%;opacity:0;animation:twinkle 2s infinite alternate}
.night .star{opacity:.8}
@keyframes twinkle{to{opacity:.25}}

.cloud{position:absolute;background:#fff9;border-radius:50px;width:140px;height:35px;filter:blur(.2px);opacity:.8;animation:cloud 35s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud:before{width:55px;height:55px;left:25px;top:-25px}
.cloud:after{width:70px;height:70px;right:18px;top:-35px}
@keyframes cloud{from{transform:translateX(-220px)}to{transform:translateX(120vw)}}

#topbar{
 position:absolute;top:0;left:0;right:0;z-index:20;
 display:flex;justify-content:space-between;align-items:center;gap:10px;
 padding:12px 16px;background:#071329cc;backdrop-filter:blur(8px);
 border-bottom:1px solid #ffffff25;
}
.logo{font-size:21px;font-weight:900}
#coins{font-weight:800;color:#ffe46b}
#timeStatus{font-size:13px;color:#dbe8ff}

#controls{display:flex;gap:7px;align-items:center}
.ctrl{
 border:1px solid #ffffff25;background:#ffffff16;color:#fff;border-radius:10px;
 padding:8px 10px;cursor:pointer
}
.ctrl:hover{background:#ffffff2b}

#island{
 position:absolute;left:50%;top:55%;width:min(900px,94vw);height:min(530px,62vh);
 transform:translate(-50%,-50%);
}
.ground{
 position:absolute;inset:0;border-radius:48% 48% 43% 43%;
 background:
 radial-gradient(circle at 30% 30%,#7dd35b 0 4%,transparent 4.5%),
 radial-gradient(circle at 70% 60%,#63bd49 0 3%,transparent 3.5%),
 linear-gradient(145deg,#4caa43,#26723e);
 border:12px solid #245d36;
 box-shadow:0 28px 0 #143c2b,0 38px 45px #0008,inset 0 0 40px #173f2c88;
}
.day .ground{filter:saturate(1.12)}
.night .ground{filter:brightness(.72) saturate(.9)}

#water{
 position:absolute;right:5%;bottom:8%;width:170px;height:80px;border-radius:50%;
 background:linear-gradient(135deg,#4cc9e8,#237ac8);
 box-shadow:inset 0 0 20px #b7f5ff66,0 7px 0 #174e65;
}
.waterfall{position:absolute;right:12%;bottom:28%;width:30px;height:85px;background:linear-gradient(#a8f5ff,#4bc4e8);border-radius:20px;opacity:.85}

.scenery{position:absolute;font-size:36px;z-index:3;user-select:none}
.tree{filter:drop-shadow(0 6px 2px #1238)}
.rock{font-size:30px}
.flower{font-size:25px}
.crystal{font-size:28px}
#s1{left:9%;top:17%}#s2{left:18%;top:67%}#s3{left:78%;top:18%}#s4{left:86%;top:48%}
#s5{left:37%;top:12%}#s6{left:62%;top:76%}#s7{left:47%;top:70%}
#s8{left:28%;top:40%}#s9{left:70%;top:38%}#s10{left:53%;top:22%}

#monsters{
 position:absolute;inset:0;z-index:6;
}
.monster-slot{
 position:absolute;width:130px;height:160px;
 transform:translate(-50%,-50%);
 display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
}
.monster-slot:nth-child(1){left:25%;top:38%}
.monster-slot:nth-child(2){left:43%;top:57%}
.monster-slot:nth-child(3){left:64%;top:36%}
.monster-slot:nth-child(4){left:76%;top:65%}
.monster-slot:nth-child(5){left:51%;top:31%}

.pedestal{
 width:105px;height:38px;border-radius:50%;
 background:linear-gradient(#8c7654,#55452e);
 border:4px solid #3d2e20;
 box-shadow:0 10px 9px #0008,inset 0 5px 5px #ffffff33;
 position:absolute;bottom:8px;
}
.monster{
 position:relative;z-index:2;font-size:72px;line-height:1;
 filter:drop-shadow(0 8px 4px #0009);
 transform:translateY(-18px);
 transition:transform .15s,filter .15s;
 user-select:none;
}
.monster.playing{animation:bounce .25s ease-in-out 2}
@keyframes bounce{
  0%,100%{transform:translateY(-18px) scale(1)}
  50%{transform:translateY(-29px) scale(1.08)}
}
.monster-name{
 position:absolute;bottom:-19px;background:#071329d9;padding:4px 9px;
 border-radius:9px;font-size:11px;font-weight:bold;z-index:5;
}
.empty{opacity:.25;font-size:12px;position:absolute;bottom:20px}

#shop{
 position:absolute;left:14px;bottom:14px;z-index:30;width:min(430px,calc(100vw - 28px));
 max-height:42vh;overflow:auto;
 background:#08152bea;border:1px solid #ffffff25;border-radius:18px;
 padding:12px;box-shadow:0 12px 35px #0008;backdrop-filter:blur(10px);
}
#shop h2{margin:0 0 8px;font-size:17px}
.card{
 display:grid;grid-template-columns:45px 1fr auto;gap:8px;align-items:center;
 padding:8px;margin:6px 0;border-radius:13px;background:#ffffff0d;
 border:1px solid #ffffff12;
}
.icon{font-size:34px;text-align:center}
.info b{display:block}.info small{color:#b9c8dc}
.buy{
 border:0;border-radius:9px;padding:8px 10px;background:#43c66a;color:#082112;
 font-weight:900;cursor:pointer
}
.buy:disabled{background:#555;color:#aaa;cursor:not-allowed}
.buy.owned{background:#35536b;color:#dbe8f2}

#toast{
 position:absolute;top:75px;left:50%;transform:translateX(-50%) translateY(-15px);
 z-index:50;background:#071329ee;padding:10px 16px;border-radius:12px;
 opacity:0;pointer-events:none;transition:.25s;font-weight:bold
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#hint{
 position:absolute;right:14px;bottom:14px;z-index:20;
 background:#071329bb;border:1px solid #ffffff20;padding:9px 12px;border-radius:12px;
 font-size:12px;color:#d8e5f7
}

@media(max-width:700px){
 #topbar{flex-wrap:wrap}
 #timeStatus{order:3;width:100%;text-align:center}
 .logo{font-size:17px}
 #island{top:53%;height:58vh}
 .monster-slot{width:100px;height:130px}
 .monster{font-size:57px}
 .pedestal{width:85px;height:30px}
 #hint{display:none}
 #shop{max-height:39vh}
}
</style>
</head>
<body class="day">
<div id="game">
  <div id="sky">
    <div id="sun"></div><div id="moon"></div>
    <div class="cloud" style="top:15%;left:-10%"></div>
    <div class="cloud" style="top:27%;left:35%;animation-delay:-18s"></div>
    <div class="star" style="left:8%;top:12%"></div><div class="star" style="left:18%;top:24%"></div>
    <div class="star" style="left:31%;top:10%"></div><div class="star" style="left:44%;top:19%"></div>
    <div class="star" style="left:57%;top:8%"></div><div class="star" style="left:69%;top:24%"></div>
    <div class="star" style="left:83%;top:12%"></div><div class="star" style="left:92%;top:31%"></div>
  </div>

  <header id="topbar">
    <div class="logo">🎵 Monster Island</div>
    <div id="coins">💰 50</div>
    <div id="timeStatus">☀️ Dia • troca em 05:00</div>
    <div id="controls">
      <button class="ctrl" id="volDown">🔉 −</button>
      <button class="ctrl" id="playPause">⏸️ Música</button>
      <button class="ctrl" id="volUp">🔊 +</button>
      <span class="ctrl" id="volText">130%</span>
    </div>
  </header>

  <main id="island">
    <div class="ground"></div>
    <div id="water"></div><div class="waterfall"></div>

    <div id="s1" class="scenery tree">🌳</div><div id="s2" class="scenery tree">🌲</div>
    <div id="s3" class="scenery tree">🌴</div><div id="s4" class="scenery tree">🌳</div>
    <div id="s5" class="scenery rock">🪨</div><div id="s6" class="scenery rock">🪨</div>
    <div id="s7" class="scenery flower">🌸</div><div id="s8" class="scenery flower">🌼</div>
    <div id="s9" class="scenery crystal">💎</div><div id="s10" class="scenery crystal">🔮</div>

    <div id="monsters"></div>
  </main>

  <section id="shop">
    <h2>🏪 Loja de Monstros</h2>
    <div id="shopCards"></div>
  </section>

  <div id="hint">Compre monstros para criar sua música. Eles produzem moedas automaticamente.</div>
  <div id="toast"></div>
</div>

<script>
const creatures = [
 {id:"batu",name:"Batu",emoji:"🪨",cost:10,income:Math.floor(10/4),desc:"Percussão • grave",wave:"sine",
  notes:[110,0,110,0,147,0,110,0]},
 {id:"foli",name:"Foli",emoji:"🌿",cost:15,income:Math.floor(15/4),desc:"Voz • suave",wave:"triangle",
  notes:[262,330,392,330,262,330,392,330]},
 {id:"pipo",name:"Pipo",emoji:"🐸",cost:20,income:Math.floor(20/4),desc:"Sapo • ritmo",wave:"square",
  notes:[392,0,392,523,392,0,330,0]},
 {id:"tecla",name:"Tecla",emoji:"🎹",cost:30,income:Math.floor(30/4),desc:"Teclado • melodia",wave:"sine",
  notes:[523,659,784,659,587,659,523,440]},
 {id:"viole",name:"Viole",emoji:"🎻",cost:40,income:Math.floor(40/4),desc:"Violino • melodia",wave:"violin",
  notes:[392,523,659,523,440,523,784,659]}
];

let coins=50;
let owned=new Set();
let musicOn=true;
let volume=1.30;
let audioCtx=null, master=null;
let beat=0;
const tempo=300;
let day=true;
let cycleSeconds=300;
let cycleRemaining=cycleSeconds;

const $=id=>document.getElementById(id);

function updateCoins(){ $("coins").textContent="💰 "+coins; }
function toast(msg){
 const t=$("toast");t.textContent=msg;t.classList.add("show");
 setTimeout(()=>t.classList.remove("show"),1700);
}

function ensureAudio(){
 if(!audioCtx){
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  master=audioCtx.createGain();
  master.gain.value=volume;
  master.connect(audioCtx.destination);
 }
 if(audioCtx.state==="suspended") audioCtx.resume();
}

function playTone(freq,type="sine",duration=.20,when=0){
 if(!freq || !musicOn)return;
 ensureAudio();
 const now=audioCtx.currentTime+when;
 const osc=audioCtx.createOscillator();
 const gain=audioCtx.createGain();
 osc.type=type==="violin"?"sawtooth":type;
 osc.frequency.setValueAtTime(freq,now);

 if(type==="violin"){
   const filter=audioCtx.createBiquadFilter();
   filter.type="lowpass"; filter.frequency.value=1800; filter.Q.value=1;
   const lfo=audioCtx.createOscillator(), lfoGain=audioCtx.createGain();
   lfo.frequency.value=5.2; lfoGain.gain.value=7;
   lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
   osc.connect(filter); filter.connect(gain);
   lfo.start(now); lfo.stop(now+duration+.05);
   gain.gain.setValueAtTime(0.0001,now);
   gain.gain.exponentialRampToValueAtTime(.18,now+.025);
   gain.gain.exponentialRampToValueAtTime(.11,now+duration*.65);
   gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
   osc.start(now);osc.stop(now+duration+.03);
 }else{
   osc.connect(gain);gain.connect(master);
   gain.gain.setValueAtTime(.0001,now);
   gain.gain.exponentialRampToValueAtTime(.16,now+.018);
   gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
   osc.start(now);osc.stop(now+duration+.02);
 }
 if(type==="violin"){
   gain.connect(master);
 }
}

function flashMonster(id){
 const el=document.querySelector(`[data-monster="${id}"]`);
 if(el){el.classList.remove("playing");void el.offsetWidth;el.classList.add("playing")}
}

function musicTick(){
 if(musicOn){
   creatures.forEach(c=>{
     if(owned.has(c.id) && c.notes[beat]){
       playTone(c.notes[beat],c.wave,c.id==="viole"?.34:.20);
       flashMonster(c.id);
     }
   });
 }
 beat=(beat+1)%8;
}
setInterval(musicTick,tempo);

function renderMonsters(){
 const box=$("monsters");box.innerHTML="";
 creatures.forEach((c,i)=>{
  const slot=document.createElement("div");
  slot.className="monster-slot";
  if(owned.has(c.id)){
    slot.innerHTML=`<div class="pedestal"></div><div class="monster" data-monster="${c.id}" title="${c.name}">${c.emoji}</div><div class="monster-name">${c.name}</div>`;
    slot.querySelector(".monster").onclick=()=>playTone(c.notes[0]||440,c.wave,c.id==="viole"?.4:.25);
  }else{
    slot.innerHTML=`<div class="pedestal"></div><div class="empty">Espaço vazio</div>`;
  }
  box.appendChild(slot);
 });
}

function renderShop(){
 const box=$("shopCards");box.innerHTML="";
 creatures.forEach(c=>{
  const have=owned.has(c.id);
  const card=document.createElement("div");card.className="card";
  card.innerHTML=`
   <div class="icon">${c.emoji}</div>
   <div class="info"><b>${c.name}</b><small>${c.desc}<br>💰 +${c.income} a cada 6s • Preço ${c.cost}</small></div>
   <button class="buy ${have?"owned":""}" ${have||coins<c.cost?"disabled":""}>${have?"✓ Comprado":"Comprar"}</button>`;
  card.querySelector("button").onclick=()=>buy(c.id);
  box.appendChild(card);
 });
}

function buy(id){
 const c=creatures.find(x=>x.id===id);
 if(!c||owned.has(id))return;
 if(coins<c.cost){toast("💸 Moedas insuficientes!");return}
 coins-=c.cost;owned.add(id);
 updateCoins();renderShop();renderMonsters();
 toast(`🎉 ${c.name} entrou para a ilha!`);
 ensureAudio();
}

function production(){
 let gain=0;
 creatures.forEach(c=>{if(owned.has(c.id))gain+=c.income});
 if(gain){
   coins+=gain;updateCoins();
   toast(`💰 +${gain} moedas`);
 }
}
setInterval(production,6000);

function toggleMusic(){
 musicOn=!musicOn;
 $("playPause").textContent=musicOn?"⏸️ Música":"▶️ Música";
 if(musicOn) ensureAudio();
}
$("playPause").onclick=toggleMusic;
$("volDown").onclick=()=>{
 volume=Math.max(.1,volume-.1);
 if(master)master.gain.value=volume;
 $("volText").textContent=Math.round(volume*100)+"%";
};
$("volUp").onclick=()=>{
 volume=Math.min(1.5,volume+.1);
 if(master)master.gain.value=volume;
 $("volText").textContent=Math.round(volume*100)+"%";
};

function setTimeMode(isDay){
 day=isDay;
 document.body.className=day?"day":"night";
 cycleRemaining=cycleSeconds;
 $("timeStatus").textContent=(day?"☀️ Dia":"🌙 Noite")+" • troca em 05:00";
}
function updateClock(){
 cycleRemaining--;
 if(cycleRemaining<=0)setTimeMode(!day);
 const m=String(Math.floor(cycleRemaining/60)).padStart(2,"0");
 const s=String(cycleRemaining%60).padStart(2,"0");
 $("timeStatus").textContent=(day?"☀️ Dia":"🌙 Noite")+" • troca em "+m+":"+s;
}
setInterval(updateClock,1000);

renderShop();renderMonsters();updateCoins();

document.addEventListener("pointerdown",()=>ensureAudio(),{once:true});
</script>
</body>
</html>
